name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pillow
      - name: Compile Python sources
        run: python -m compileall -q lib scripts
      - name: Check skill entry
        run: |
          test -f SKILL.md
          grep -q '^name: finansi-a-share-backtest$' SKILL.md
          test -f requirements.txt
          test -f lib/ashare_core/engine.py
      - name: Chart self-check
        run: python scripts/check_chart.py
